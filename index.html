<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wenzizhu Wei</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background-color: #fff;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 120px 40px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 55px;
    }

    .photo {
      width: 220px;
      height: 280px;
      object-fit: cover;
      border-radius: 6px;
    }

    .info h1 {
      margin: 0 0 18px 0;
      font-size: 38px;
      font-weight: 600;
    }

    .info p {
      margin: 8px 0;
      font-size: 17px;
      line-height: 1.6;
    }

    .student {
      color: #555;
      margin-bottom: 22px !important;
    }

    .email {
      margin-top: 22px !important;
    }

    .email a {
      color: #356a96;
      text-decoration: none;
    }

    .email a:hover {
      text-decoration: underline;
    }

    @media (max-width: 650px) {
      .container {
        padding: 60px 25px;
      }

      .profile {
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
      }

      .photo {
        width: 180px;
        height: 230px;
      }

      .info h1 {
        font-size: 32px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="profile">

      <img src="photo.jpg" alt="Wenzizhu Wei" class="photo">

      <div class="info">

        <h1>Wenzizhu Wei</h1>

        <p class="student">
          Undergraduate Student
        </p>

        <p>
          School of Statistics<br>

          Renmin University of China
        </p>

        <p class="email">
          Email:
          <a href="mailto:weiwenzizhu2024@ruc.edu.cn">weiwenzizhu2024@ruc.edu.cn</a>
        </p>

      </div>

    </div>

  </div>

</body>

</html>
